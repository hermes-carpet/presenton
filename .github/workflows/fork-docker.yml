# Builds this fork's image and publishes it to ghcr.io/<owner>/<repo> with the
# tags latest, <version> (from package.json, e.g. 0.9.11; no "v", no
# pre-release suffix) and sha-<commit>. Runs after "Test All Applications"
# passes on main, or manually. The image is smoke-tested (web UI, canvas API,
# MCP tool list through nginx) before anything is pushed.
#
# Upstream's docker-release.yml is left untouched; it targets
# ghcr.io/presenton/presenton and never triggers in this fork (it runs on
# releases and manual dispatch only).
name: Fork Docker image

on:
  workflow_run:
    # Upstream's test workflow (test-all.yml). If upstream renames it, update this.
    workflows: ["Test All Applications"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      platforms:
        description: Target platforms
        type: choice
        default: linux/amd64
        options:
          - linux/amd64
          - linux/amd64,linux/arm64

permissions:
  contents: read
  packages: write

concurrency:
  # A newer main supersedes an older build, so `latest` never moves backwards.
  group: fork-docker
  cancel-in-progress: true

jobs:
  image:
    name: Build, smoke-test and push
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      PLATFORMS: ${{ inputs.platforms || 'linux/amd64' }}
      SMOKE_TAG: presenton-fork:smoke

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Prepare tags
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version=$(node -p "require('./package.json').version")
          version=${version#v}
          version=${version%%-*}
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected package.json version: ${version}"
            exit 1
          fi
          {
            echo "image=${image}"
            echo "version=${version}"
            echo "tags<<EOF"
            echo "${image}:latest"
            echo "${image}:${version}"
            echo "${image}:sha-${SOURCE_SHA:0:7}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Tags: latest, ${version}, sha-${SOURCE_SHA:0:7}"

      - name: Set up QEMU
        if: contains(env.PLATFORMS, 'arm64')
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.SMOKE_TAG }}
          cache-from: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache

      - name: Smoke test
        run: .github/scripts/docker-smoke-test.sh "$SMOKE_TAG"

      - name: Push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache
          # Registry cache: no 10 GB limit like the GitHub Actions cache.
          cache-to: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache,mode=max
